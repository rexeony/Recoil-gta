# Made by cheeseburger - Weapon Fire Recoil

[Main]

Author = cheeseburger

# When firing a weapon, it gives a knockback effect to the camera movement to upper and move sideways.
# Vertical measures the knockback camera of raising up. While horizontal is moving sideways left or right.

# Acceptable values are 0 - 300. Set to 0 to disable.
# While not moving, recoil values will be used as is the values below.
# (100) - Multiplies the vertical recoil value when the player is moving while shooting.
PenaltyPercent = 100

# 1 atau -1. Ganti ke -1 kalau kick vertikal malah menarik kamera ke bawah.
VerticalSign = 1


# Acceptable values are 0.0 - 4.0. Set it to 0.0 to disable.

